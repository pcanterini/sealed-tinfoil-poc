# Sanity release (v0.0.90): same image, no keyserver, no volume, no secrets. Used only to check that a
# plain instance boots on this account.
cvm-version: 0.14.13
cpus: 2
memory: 8192

networks:
  egress:
    egress: allowlist
    allow:
      - imap.gmail.com
      - inference.tinfoil.sh

containers:
  - name: app
    image: "ghcr.io/pcanterini/sealed-tinfoil-poc@sha256:0c4743f908985be6ca90e8b3e001d81c4cfac42baf5ec991def0c3c62aba0a65"
    env:
      - APP_VERSION: "v0.0.90-sanity"
    attestation: true
    networks: [egress]
    restart: always

shim:
  upstream-port: 8080
  paths:
    - /*
