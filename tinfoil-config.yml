# Diagnostic release (v0.0.91): keyserver + private secret, no volume. Checks whether private secret
# delivery alone boots on this account.
cvm-version: 0.14.13
cpus: 2
memory: 8192

keyserver-url: https://35-223-205-2.sslip.io

networks:
  egress:
    egress: allowlist
    allow:
      - imap.gmail.com
      - inference.tinfoil.sh

containers:
  - name: app
    image: "ghcr.io/pcanterini/sealed-tinfoil-poc@sha256:0c4743f908985be6ca90e8b3e001d81c4cfac42baf5ec991def0c3c62aba0a65"
    env:
      - APP_VERSION: "v0.0.91-keyserver-only"
    secrets:
      - POC_SECRET
    attestation: true
    networks: [egress]
    restart: always

shim:
  upstream-port: 8080
  paths:
    - /*
