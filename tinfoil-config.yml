# Diagnostic release (v0.0.92): volume with manual unlock (no key-secret, no keyserver). Checks whether an
# attached volume by itself stops the enclave from launching.
cvm-version: 0.14.13
cpus: 2
memory: 8192

volumes:
  - name: data
    owner: "65532:65532"

containers:
  - name: app
    image: "ghcr.io/pcanterini/sealed-tinfoil-poc@sha256:0c4743f908985be6ca90e8b3e001d81c4cfac42baf5ec991def0c3c62aba0a65"
    env:
      - APP_VERSION: "v0.0.92-volume-manual"
    attestation: true
    persistent_volumes: ["data:/data"]
    restart: always

shim:
  upstream-port: 8080
  paths:
    - /*
